<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>全員辨識推論檢視</title>
<style>
:root{
  --bg:#f4f5f7;--panel:#ffffff;--raised:#eef0f3;--line:#d9dde3;--text:#16191d;--muted:#5d6570;
  --accent:#0b72b9;--accent-soft:#e3f0fa;--ok:#1a7f4b;--ok-soft:#e2f4ea;--bad:#c2410c;--bad-soft:#fdebdc;
  --review:#b42318;--review-soft:#fde8e7;--chip:#e8ebef;--tile:#fbfbfc;--shadow:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.06);
  --tile-w:62px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1114;--panel:#171a1e;--raised:#1f2328;--line:#2c3137;--text:#e7eaee;--muted:#98a1ab;
  --accent:#4fb3f0;--accent-soft:#12293a;--ok:#4cc38a;--ok-soft:#13291e;--bad:#f59e5b;--bad-soft:#35220f;
  --review:#f87171;--review-soft:#3a1717;--chip:#262b31;--tile:#1b1f23;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#0f1114;--panel:#171a1e;--raised:#1f2328;--line:#2c3137;--text:#e7eaee;--muted:#98a1ab;
  --accent:#4fb3f0;--accent-soft:#12293a;--ok:#4cc38a;--ok-soft:#13291e;--bad:#f59e5b;--bad-soft:#35220f;
  --review:#f87171;--review-soft:#3a1717;--chip:#262b31;--tile:#1b1f23;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 16px}
h1{font-size:16px;margin:0 8px 0 0;font-weight:700;letter-spacing:.02em}
.muted{color:var(--muted)}
select,input[type=search]{background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:6px 9px;min-width:0;max-width:100%}
input[type=search]{width:190px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--raised);padding:6px 10px;cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.slider{display:flex;align-items:center;gap:6px}
.slider input{width:110px;accent-color:var(--accent)}
.ghost,.primary{border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;background:transparent;text-decoration:none;color:inherit;display:inline-block}
.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.ghost:hover,.seg button:hover{border-color:var(--accent)}
.stats{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 10px}
.stat{background:var(--raised);border-radius:6px;padding:4px 10px;font-variant-numeric:tabular-nums}
.stat b{font-weight:700}
.stat.review b{color:var(--review)}.stat.ok b{color:var(--ok)}.stat.bad b{color:var(--bad)}
main{display:grid;grid-template-columns:minmax(0,1fr)}
main.with-detail{grid-template-columns:minmax(0,1fr) 420px}
.gridwrap{overflow:auto;padding:12px 16px 40px;min-width:0}
.person{margin:0 0 12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;box-shadow:var(--shadow)}
.person h2{font-size:14px;margin:0 0 6px}
.person ul{margin:0;padding-left:18px}
table.sheet{border-collapse:separate;border-spacing:4px}
.sheet th{font-weight:600;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.sheet thead th{position:sticky;top:0;background:var(--bg);z-index:2;padding:2px 0;max-width:var(--tile-w);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet thead th small{display:block;font-weight:400;font-size:11px}
.sheet tbody th{position:sticky;left:0;background:var(--bg);z-index:1;padding-right:6px;text-align:right;white-space:nowrap}
.sheet td{padding:0;vertical-align:top}
.tile{width:var(--tile-w);background:var(--tile);border:1px solid var(--line);border-radius:6px;cursor:pointer;overflow:hidden;display:block;padding:0;text-align:left;position:relative}
.tile:hover{border-color:var(--accent)}
.tile.sel{outline:2px solid var(--accent);outline-offset:1px}
.tile.ok{border-color:var(--ok);box-shadow:inset 0 -3px 0 var(--ok)}
.tile.bad{border-color:var(--bad);box-shadow:inset 0 -3px 0 var(--bad);background:var(--bad-soft)}
.tile.review{border-color:var(--review);border-style:dashed}
.tile.hit{outline:3px solid var(--accent);outline-offset:1px}
.tile.dim{opacity:.22}
.thumb{position:relative;overflow:hidden;width:100%;background:#fff}
.thumb img{position:absolute;max-width:none}
.codes{display:flex;flex-wrap:wrap;gap:2px;padding:3px;min-height:22px}
.code{font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--chip);border-radius:4px;padding:3px 4px}
.code.low{background:var(--review-soft);color:var(--review)}
.code.hit{background:var(--accent);color:#fff}
aside{border-left:1px solid var(--line);background:var(--panel);padding:14px 16px 40px;position:sticky;top:0;height:100vh;overflow:auto;display:none}
main.with-detail aside{display:block}
aside h2{font-size:15px;margin:0}
.detail-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.figure{background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.figure svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin:8px 0}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid;vertical-align:middle;margin-right:4px}
.row{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.meter{height:5px;border-radius:3px;background:var(--raised);overflow:hidden;margin-top:4px}
.meter span{display:block;height:100%;background:var(--accent)}
.meter span.low{background:var(--review)}
.cmp{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:10px 0}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.none{background:var(--raised);color:var(--muted)}.pill.review{background:var(--review-soft);color:var(--review)}
.hint{font-size:12px;color:var(--muted);margin-top:12px}
.kbd{border:1px solid var(--line);border-radius:4px;padding:0 5px;font:12px ui-monospace,monospace;background:var(--raised)}
dialog{border:1px solid var(--line);border-radius:10px;padding:0;background:var(--panel);color:var(--text);max-width:min(96vw,1100px);max-height:94vh}
dialog img{display:block;max-width:100%;height:auto}
dialog .bar{border-bottom:1px solid var(--line)}
/* people view */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;box-shadow:var(--shadow)}
.card.flag{border-color:var(--review)}
.card h3{margin:0 0 6px;font-size:15px;display:flex;gap:8px;align-items:baseline}
.card h3 .code{font-size:13px}
.card ol{list-style:none;margin:0;padding:0;font-variant-numeric:tabular-nums}
.card li{display:grid;grid-template-columns:52px 1fr auto;gap:6px;padding:2px 0;border-top:1px dashed var(--line)}
.card li.low{color:var(--review)}
.card button{float:right}
/* upload */
.drop{margin:28px auto;max-width:620px;border:2px dashed var(--line);border-radius:14px;background:var(--panel);padding:44px 24px;text-align:center;box-shadow:var(--shadow)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop h2{margin:0 0 6px;font-size:20px}
.drop p{margin:6px 0 18px;color:var(--muted)}
.busy{position:fixed;inset:0;background:rgba(10,12,14,.45);display:grid;place-items:center;z-index:50}
.busy div{background:var(--panel);border-radius:12px;padding:22px 28px;box-shadow:var(--shadow);min-width:280px;text-align:center}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.error{margin:16px auto;max-width:620px;border:1px solid var(--review);background:var(--review-soft);color:var(--review);border-radius:10px;padding:12px 16px;white-space:pre-wrap}
.nodata #views,.nodata #filters,.nodata #query,.nodata .slider,.nodata #zoom,.nodata #overview,.nodata #json,.nodata #meta,.nodata #sheet{display:none!important}
#uploadTools{display:inline-flex;gap:8px;align-items:center;min-width:0;max-width:100%}
#history{min-width:0;max-width:min(420px,100%);flex:1}
.empty{padding:40px;text-align:center;color:var(--muted)}
@media (max-width:900px){
  header{position:static}
  main.with-detail{grid-template-columns:1fr}
  aside{position:fixed;inset:auto 0 0 0;height:62vh;border-left:0;border-top:1px solid var(--line);z-index:30;box-shadow:var(--shadow)}
  input[type=search]{width:140px}
  .bar{padding:8px 12px}.gridwrap{padding:10px 12px 40px}
  #uploadTools{display:flex;width:100%}
  .drop,.error{margin-left:12px;margin-right:12px}
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1 id="title">全員辨識推論檢視</h1>
    <span id="uploadTools" hidden>
      <label class="primary" for="file">上傳班表</label>
      <input id="file" type="file" accept="image/*" hidden>
      <select id="history" aria-label="歷史紀錄"><option value="">歷史紀錄</option></select>
    </span>
    <select id="sheet" aria-label="班表"></select>
    <div class="seg" id="views" role="group" aria-label="檢視">
      <button data-v="grid" aria-pressed="true">格子</button><button data-v="people">人員班表</button>
    </div>
    <div class="seg" id="filters" role="group" aria-label="篩選">
      <button data-f="all" aria-pressed="true">全部</button>
      <button data-f="review">需複核</button>
      <button data-f="bad">與標註不符</button>
      <button data-f="labelled">已標註</button>
    </div>
    <input id="query" type="search" placeholder="搜尋代號或姓名（如 72）" autocomplete="off">
    <label class="slider" title="信心低於門檻的代號標為需複核">門檻 <input id="threshold" type="range" min="0.3" max="0.99" step="0.01" value="0.75"> <span id="thrv">0.75</span></label>
    <div class="seg" id="zoom" role="group" aria-label="大小">
      <button data-z="48">小</button><button data-z="62" aria-pressed="true">中</button><button data-z="84">大</button>
    </div>
    <button class="ghost" id="overview">原圖</button>
    <a class="ghost" id="json" hidden download>JSON</a>
    <button class="ghost" id="theme" title="切換深淺色">◐</button>
    <span class="muted" id="meta" style="margin-left:auto;font-size:12px"></span>
  </div>
  <div class="stats" id="stats"></div>
</header>
<div id="error" class="error" hidden></div>
<section id="dropzone" class="drop" hidden>
  <h2>上傳一張班表照片</h2>
  <p>拖曳照片到這裡、貼上（⌘V／Ctrl+V），或按下方按鈕。<br>會先校正透視、切出 19×30 格，再用 V2 line model 辨識每格人員代號。</p>
  <label class="primary" for="file">選擇照片</label>
</section>
<main id="main">
  <section class="gridwrap">
    <div id="person"></div>
    <div id="grid"></div>
  </section>
  <aside id="detail" aria-live="polite"></aside>
</main>
<div class="busy" id="busy" hidden><div><div class="spin"></div><b id="busyText">辨識中</b><div class="muted" id="busyTime">0 秒</div></div></div>
<dialog id="dlg"><div class="bar"><b id="dlgTitle"></b><button class="ghost" style="margin-left:auto" onclick="dlg.close()">關閉</button></div><img id="dlgImg" alt="校正後原圖"></dialog>
<script src="data.js"></script>
<script>
(() => {
const $ = s => document.querySelector(s);
const DEMO = !!window.DEMO_MODE;
let D = window.VIEWER_DATA || null;
if (!D && !DEMO) { document.body.innerHTML = '<p class="empty">找不到 data.js，請先執行 <code>python -m all_staff.cli viewer</code>。</p>'; return; }
let ALLOWED = new Set(), ROSTER = {}, HAS_ROSTER = false, COLNAMES = {};
const state = {sheet: 0, filter: 'all', query: '', thr: 0.75, sel: null, view: 'grid'};
try { const saved = JSON.parse(localStorage.getItem('allStaffViewer') || '{}'); state.thr = saved.thr ?? .75; state.sheet = saved.sheet ?? 0; state.view = saved.view ?? 'grid'; } catch (e) {}
const persist = () => { try { localStorage.setItem('allStaffViewer', JSON.stringify({thr: state.thr, sheet: state.sheet, view: state.view})); } catch (e) {} };
const esc = s => String(s ?? '').replace(/[&<>"]/g, ch => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[ch]));
const TIME = r => (D && D.time_rows[String(r)]) || ('r' + r);
const COL = c => 'c' + String(c).padStart(2, '0');
const DUTY = c => COLNAMES[String(c)] || '';
const PLACE = c => DUTY(c) ? `${esc(DUTY(c))} <span class="muted">${COL(c)}</span>` : COL(c);
const sheetNow = () => D.sheets[state.sheet];

function load(data) {
  document.body.classList.remove('nodata');
  D = data; ALLOWED = new Set(D.allowed); ROSTER = D.roster || {}; HAS_ROSTER = Object.keys(ROSTER).length > 0; COLNAMES = D.column_names || {};
  state.sheet = Math.min(Math.max(0, state.sheet), D.sheets.length - 1); state.sel = null;
  $('#sheet').hidden = D.sheets.length < 2;
  $('#dropzone').hidden = true; $('#main').hidden = false;
  const labelled = D.sheets.some(s => s.cells.some(c => c.truth));
  $('#filters [data-f=bad]').hidden = $('#filters [data-f=labelled]').hidden = !labelled;
  if (DEMO && D.run) { $('#json').hidden = false; $('#json').href = '/api/runs/' + D.run.id; $('#json').download = D.run.id + '.json'; }
  sheetOptions(); render();
}

function review(cell, p) {
  const line = cell.lines[p.line];
  const leftover = line && line.text.replace(/#/g, '') !== cell.pred.filter(q => q.line === p.line).map(q => q.code).join('');
  return p.conf < state.thr || !ALLOWED.has(p.code) || leftover || (HAS_ROSTER && !ROSTER[p.code]);
}
function evaluate(cell) {
  const needs = cell.pred.some(p => review(cell, p));
  let status = 'none';
  if (cell.truth && cell.truth.every(t => t.role === 'personnel_code')) {
    const a = cell.truth.map(t => t.code).sort().join(','), b = cell.pred.map(p => p.code).sort().join(',');
    status = a === b ? 'ok' : 'bad';
  }
  return {needs, status};
}
const codeMatches = code => state.query && (code.toUpperCase() === state.query.toUpperCase() || (ROSTER[code] || '').includes(state.query));
const matchesQuery = cell => cell.pred.some(p => codeMatches(p.code));

function sheetOptions() {
  $('#sheet').innerHTML = D.sheets.map((s, i) => `<option value="${i}">${esc(s.name)}（${s.split ? s.split + '，' : ''}${s.cells.reduce((n, c) => n + c.pred.length, 0)} 個代號）</option>`).join('');
  $('#sheet').value = state.sheet;
}

function renderStats() {
  const s = sheetNow();
  let codes = 0, needs = 0, labelled = 0, ok = 0, tp = 0, fp = 0, fn = 0;
  const people = new Set();
  for (const c of s.cells) {
    codes += c.pred.length; c.pred.forEach(p => people.add(p.code)); needs += c.pred.filter(p => review(c, p)).length;
    const e = evaluate(c);
    if (e.status !== 'none') {
      labelled++; ok += e.status === 'ok';
      const t = {}, p = {}; c.truth.forEach(x => t[x.code] = (t[x.code] || 0) + 1); c.pred.forEach(x => p[x.code] = (p[x.code] || 0) + 1);
      let o = 0; for (const k in t) o += Math.min(t[k], p[k] || 0);
      tp += o; fp += c.pred.length - o; fn += c.truth.length - o;
    }
  }
  const pct = x => (x * 100).toFixed(1) + '%';
  $('#stats').innerHTML = [
    `<span class="stat">格子 <b>${s.cells.length}</b></span>`,
    `<span class="stat">人員 <b>${people.size}</b></span>`,
    `<span class="stat">代號 <b>${codes}</b></span>`,
    `<span class="stat review">需複核 <b>${needs}</b></span>`,
    labelled ? `<span class="stat ok">已標註格全對 <b>${ok}/${labelled}</b>（${pct(ok / labelled)}）</span><span class="stat">Precision <b>${pct(tp / Math.max(1, tp + fp))}</b></span><span class="stat">Recall <b>${pct(tp / Math.max(1, tp + fn))}</b></span>` : '',
    labelled - ok ? `<span class="stat bad">不符 <b>${labelled - ok}</b></span>` : '',
    D.run ? `<span class="stat">耗時 <b>${D.run.seconds}s</b></span>` : '',
    ...(s.warnings || []).map(w => `<span class="pill review" style="padding:4px 10px">⚠ ${esc(w)}</span>`)
  ].join('');
  const best = D.model.best ? `｜val ${(D.model.best.val_exact * 100).toFixed(1)}%` : '';
  $('#meta').textContent = `${D.model.path.split('/').slice(-2).join('/')}${best}｜${D.generated_at}`;
  $('#overview').disabled = !s.overview;
}

function thumb(cell) {
  const w = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--tile-w')) - 2, h = Math.round(w * 1.4);
  const [a, b, c, d] = cell.core, mx = (c - a) * .06, my = (d - b) * .04;
  const x1 = Math.max(0, a - mx), y1 = Math.max(0, b - my), x2 = Math.min(cell.w, c + mx), y2 = Math.min(cell.h, d + my);
  const scale = Math.min(w / (x2 - x1), h / (y2 - y1));
  const left = -x1 * scale + (w - (x2 - x1) * scale) / 2, top = -y1 * scale + (h - (y2 - y1) * scale) / 2;
  return `<div class="thumb" style="height:${h}px"><img loading="lazy" alt="" src="${esc(cell.img)}" style="width:${cell.w * scale}px;left:${left}px;top:${top}px;clip-path:inset(${y1 * scale}px ${(cell.w - x2) * scale}px ${(cell.h - y2) * scale}px ${x1 * scale}px)"></div>`;
}

function renderGrid() {
  const s = sheetNow(), byKey = new Map(s.cells.map(c => [c.r + ':' + c.c, c]));
  let html = '<table class="sheet"><thead><tr><th></th>' + s.columns.map(c => `<th title="${esc(DUTY(c))}">${COL(c)}${DUTY(c) ? `<small>${esc(DUTY(c))}</small>` : ''}</th>`).join('') + '</tr></thead><tbody>';
  for (const r of s.rows) {
    html += `<tr><th>${TIME(r)}</th>`;
    for (const c of s.columns) {
      const cell = byKey.get(r + ':' + c);
      if (!cell) { html += '<td></td>'; continue; }
      const e = evaluate(cell), hit = matchesQuery(cell);
      const hidden = (state.filter === 'review' && !e.needs) || (state.filter === 'bad' && e.status !== 'bad') || (state.filter === 'labelled' && e.status === 'none');
      const cls = ['tile', e.status === 'ok' ? 'ok' : '', e.status === 'bad' ? 'bad' : '', e.needs ? 'review' : '',
        hit ? 'hit' : '', (hidden || (state.query && !hit)) ? 'dim' : '', state.sel === cell.id ? 'sel' : ''].join(' ');
      const chips = cell.pred.map(p => `<span class="code${review(cell, p) ? ' low' : ''}${codeMatches(p.code) ? ' hit' : ''}" title="${esc(ROSTER[p.code] || '')} ${(p.conf * 100).toFixed(0)}%">${esc(p.code)}</span>`).join('');
      html += `<td><button class="${cls}" data-id="${cell.id}" aria-label="${TIME(r)} ${COL(c)} ${cell.pred.map(p => p.code).join(' ')}">${thumb(cell)}<div class="codes">${chips}</div></button></td>`;
    }
    html += '</tr>';
  }
  $('#grid').innerHTML = html + '</tbody></table>';
}

function peopleList() {
  const order = new Map([...ALLOWED].map((c, i) => [c, i])), map = new Map();
  for (const cell of sheetNow().cells) for (const p of cell.pred) {
    if (!map.has(p.code)) map.set(p.code, []);
    map.get(p.code).push({cell, p, low: review(cell, p)});
  }
  return [...map.entries()].sort((a, b) => (order.get(a[0]) ?? 1e6) - (order.get(b[0]) ?? 1e6))
    .map(([code, slots]) => ({code, name: ROSTER[code] || '', slots: slots.sort((a, b) => a.cell.r - b.cell.r || a.cell.c - b.cell.c)}));
}
function personText(person) {
  const head = person.name ? `${person.name}（${person.code}）` : person.code;
  return [head, ...person.slots.map(s => `${TIME(s.cell.r)} ${DUTY(s.cell.c) || COL(s.cell.c)}${s.low ? '（待確認）' : ''}`)].join('\n');
}

function renderPeople() {
  const list = peopleList().filter(p => !state.query || codeMatches(p.code));
  const onlyReview = state.filter === 'review';
  // people whose every slot is low-confidence are most likely noise: list them last
  const noise = p => p.slots.every(s => s.low);
  const cards = list.filter(p => !onlyReview || p.slots.some(s => s.low)).sort((a, b) => noise(a) - noise(b)).map(p => {
    const hours = new Set(p.slots.map(s => s.cell.r)).size, flagged = p.slots.some(s => s.low);
    return `<article class="card${flagged ? ' flag' : ''}"${noise(p) ? ' style="opacity:.55" title="全部時段都低信心，可能是雜訊"' : ''}><button class="ghost" data-copy="${esc(p.code)}" title="複製文字">複製</button><h3><span class="code${flagged ? ' low' : ''}">${esc(p.code)}</span>${esc(p.name)}<span class="muted" style="font-size:12px;font-weight:400">${hours} 小時</span></h3><ol>${
      p.slots.map(s => `<li class="${s.low ? 'low' : ''}"><span>${TIME(s.cell.r)}</span><span><a href="#" data-goto="${s.cell.id}">${PLACE(s.cell.c)}</a></span><span>${(s.p.conf * 100).toFixed(0)}%</span></li>`).join('')}</ol></article>`;
  });
  $('#grid').innerHTML = cards.length ? `<div class="people">${cards.join('')}</div>` : '<p class="empty">沒有符合的人員。</p>';
}

function renderPerson() {
  const el = $('#person');
  if (!state.query || state.view !== 'grid') { el.innerHTML = ''; return; }
  const hits = sheetNow().cells.filter(matchesQuery);
  const code = hits.length ? hits[0].pred.find(p => codeMatches(p.code))?.code : state.query;
  const byCol = {};
  hits.forEach(c => (byCol[c.c] = byCol[c.c] || []).push(c.r));
  const ranges = Object.entries(byCol).sort((a, b) => Math.min(...a[1]) - Math.min(...b[1])).map(([c, rows]) => {
    rows.sort((a, b) => a - b); const parts = []; let start = rows[0], prev = rows[0];
    for (const r of rows.slice(1).concat([null])) {
      if (r !== prev + 1) { parts.push(start === prev ? TIME(start) : `${TIME(start).slice(0, 2)}–${TIME(prev).slice(3)}`); start = r; }
      prev = r;
    }
    return `<li>${PLACE(+c)}：${parts.join('、')}</li>`;
  });
  el.innerHTML = `<div class="person"><h2>${esc(code || state.query)} ${esc(ROSTER[code] || '')}　<span class="muted">${hits.length} 格</span></h2>${ranges.length ? '<ul>' + ranges.join('') + '</ul>' : '<span class="muted">這張表沒有辨識到此代號。</span>'}</div>`;
}

function renderDetail() {
  const main = $('#main'), aside = $('#detail');
  const cell = sheetNow().cells.find(c => c.id === state.sel);
  if (!cell) { main.classList.remove('with-detail'); aside.innerHTML = ''; return; }
  main.classList.add('with-detail');
  const e = evaluate(cell);
  const rect = (b, color, dash, label) => `<rect x="${b[0]}" y="${b[1]}" width="${b[2] - b[0]}" height="${b[3] - b[1]}" fill="none" stroke="${color}" stroke-width="2.5" ${dash ? 'stroke-dasharray="7 5"' : ''} vector-effect="non-scaling-stroke"/>` +
    (label ? `<text x="${b[0] + 2}" y="${Math.max(12, b[1] - 4)}" font-size="15" font-weight="700" fill="${color}" paint-order="stroke" stroke="#fff" stroke-width="3">${esc(label)}</text>` : '');
  const svg = `<svg viewBox="0 0 ${cell.w} ${cell.h}" role="img" aria-label="格子影像"><image href="${esc(cell.img)}" width="${cell.w}" height="${cell.h}"/>${rect(cell.core, '#0b72b9', true, '')}${(cell.truth || []).map(t => rect(t.box, '#1a7f4b', false, '')).join('')}${cell.lines.map(l => rect(l.box, '#0b72b9', false, '')).join('')}${cell.pred.map(p => rect(p.box, review(cell, p) ? '#b42318' : '#0b72b9', false, p.code)).join('')}</svg>`;
  const pill = {ok: '<span class="pill ok">與標註一致</span>', bad: '<span class="pill bad">與標註不符</span>', none: cell.truth === undefined && DEMO ? '' : '<span class="pill none">未標註</span>'}[e.status];
  const lines = cell.lines.length ? cell.lines.map((l, i) => {
    const codes = cell.pred.filter(p => p.line === i).map(p => p.code), low = l.conf < state.thr;
    return `<div class="row"><div><b style="font-family:ui-monospace,monospace">${esc(l.text || '（空白）')}</b> <span class="muted">→ ${codes.length ? codes.map(esc).join('、') : '不計入'}</span><div class="meter"><span class="${low ? 'low' : ''}" style="width:${(l.conf * 100).toFixed(0)}%"></span></div></div><span class="${low ? 'pill review' : 'muted'}">${(l.conf * 100).toFixed(1)}%</span></div>`;
  }).join('') : '<p class="muted">沒有切出文字行。</p>';
  const names = codes => codes.length ? codes.map(c => esc(c) + (ROSTER[c] ? ` <span class="muted">${esc(ROSTER[c])}</span>` : '')).join('、') : '—';
  aside.innerHTML = `<div class="detail-head"><h2>${TIME(cell.r)}・${esc(DUTY(cell.c) || '')} ${COL(cell.c)}</h2><button class="ghost" id="close" aria-label="關閉">✕</button></div>
    <div>${pill}${e.needs ? ' <span class="pill review">需複核</span>' : ''}</div>
    <div class="cmp"><span class="muted">模型</span><span>${names(cell.pred.map(p => p.code))}</span>${cell.truth ? `<span class="muted">標註</span><span>${names(cell.truth.map(t => t.code))}</span>` : ''}</div>
    <div class="figure">${svg}</div>
    <div class="legend"><span><i style="border-color:#0b72b9;border-top-style:dashed"></i>本格範圍</span><span><i style="border-color:#0b72b9"></i>文字行／代號</span><span><i style="border-color:#b42318"></i>低信心</span>${cell.truth ? '<span><i style="border-color:#1a7f4b"></i>人工框</span>' : ''}</div>
    <h3 style="font-size:13px;margin:14px 0 2px">文字行</h3>${lines}
    <p class="hint"><span class="kbd">←</span><span class="kbd">→</span><span class="kbd">↑</span><span class="kbd">↓</span> 移動　<span class="kbd">Esc</span> 關閉<br><span style="font-family:ui-monospace,monospace">${esc(cell.id)}</span></p>`;
  $('#close').onclick = () => { state.sel = null; render(); };
}

function render() {
  if (!D) return;
  renderStats(); renderPerson();
  document.querySelectorAll('#views button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === state.view));
  $('#zoom').hidden = state.view !== 'grid';
  if (state.view === 'grid') renderGrid(); else renderPeople();
  renderDetail();
}

$('#grid').addEventListener('click', ev => {
  const copy = ev.target.closest('[data-copy]');
  if (copy) { const p = peopleList().find(x => x.code === copy.dataset.copy); navigator.clipboard?.writeText(personText(p)).then(() => { copy.textContent = '已複製'; setTimeout(() => copy.textContent = '複製', 1200); }); return; }
  const go = ev.target.closest('[data-goto]');
  if (go) { ev.preventDefault(); state.view = 'grid'; state.sel = go.dataset.goto; render(); document.querySelector(`[data-id="${state.sel}"]`)?.scrollIntoView({block: 'center', inline: 'center'}); return; }
  const b = ev.target.closest('.tile'); if (!b) return;
  state.sel = state.sel === b.dataset.id ? null : b.dataset.id; renderGrid(); renderDetail();
});
$('#sheet').onchange = ev => { state.sheet = +ev.target.value; state.sel = null; persist(); render(); };
$('#views').onclick = ev => { const b = ev.target.closest('button'); if (!b) return; state.view = b.dataset.v; persist(); render(); };
$('#filters').onclick = ev => { const b = ev.target.closest('button'); if (!b) return; state.filter = b.dataset.f; document.querySelectorAll('#filters button').forEach(x => x.setAttribute('aria-pressed', x === b)); render(); };
$('#zoom').onclick = ev => { const b = ev.target.closest('button'); if (!b) return; document.documentElement.style.setProperty('--tile-w', b.dataset.z + 'px'); document.querySelectorAll('#zoom button').forEach(x => x.setAttribute('aria-pressed', x === b)); renderGrid(); };
let timer; $('#query').oninput = ev => { clearTimeout(timer); timer = setTimeout(() => { state.query = ev.target.value.trim(); render(); }, 120); };
$('#threshold').value = state.thr; $('#thrv').textContent = state.thr.toFixed(2);
$('#threshold').oninput = ev => { state.thr = +ev.target.value; $('#thrv').textContent = state.thr.toFixed(2); persist(); render(); };
$('#overview').onclick = () => { const s = sheetNow(); if (!s.overview) return; $('#dlgTitle').textContent = s.name + '（校正後＋格線）'; $('#dlgImg').src = s.overview; $('#dlg').showModal(); };
$('#theme').onclick = () => { const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; };
document.addEventListener('keydown', ev => {
  if (!D || ev.target.matches('input,select')) return;
  if (ev.key === 'Escape' && state.sel) { state.sel = null; render(); return; }
  const s = sheetNow(), cell = s.cells.find(c => c.id === state.sel); if (!cell) return;
  const d = {ArrowLeft: [0, -1], ArrowRight: [0, 1], ArrowUp: [-1, 0], ArrowDown: [1, 0]}[ev.key]; if (!d) return;
  ev.preventDefault();
  const next = s.cells.find(c => c.r === s.rows[s.rows.indexOf(cell.r) + d[0]] && c.c === s.columns[s.columns.indexOf(cell.c) + d[1]]);
  if (next) { state.sel = next.id; renderGrid(); renderDetail(); document.querySelector(`[data-id="${next.id}"]`)?.scrollIntoView({block: 'nearest', inline: 'nearest'}); }
});

/* ---------- upload mode (python -m all_staff.cli demo) ---------- */
function showError(message) { const e = $('#error'); e.hidden = !message; e.textContent = message || ''; }
async function refreshHistory() {
  try {
    const runs = await fetch('/api/runs').then(r => r.json());
    $('#history').innerHTML = '<option value="">歷史紀錄</option>' + runs.map(r => `<option value="${esc(r.id)}">${esc(r.created)}　${esc(r.name)}（${r.codes} 個代號）</option>`).join('');
  } catch (e) {}
}
async function openRun(id) {
  showError('');
  const res = await fetch('/api/runs/' + encodeURIComponent(id)); const data = await res.json();
  if (!res.ok) { showError(data.error || '讀取失敗'); return; }
  state.sheet = 0; load(data); history.replaceState(null, '', '?run=' + encodeURIComponent(id));
}
async function upload(file) {
  if (!file) return;
  if (!file.type.startsWith('image/')) { showError('請上傳圖片檔（JPG／PNG）。'); return; }
  showError(''); $('#busy').hidden = false; $('#busyText').textContent = `辨識 ${file.name}`;
  const t0 = Date.now(), tick = setInterval(() => { $('#busyTime').textContent = `${Math.round((Date.now() - t0) / 1000)} 秒・校正格線、切格、辨識中`; }, 500);
  try {
    const res = await fetch('/api/analyze?name=' + encodeURIComponent(file.name), {method: 'POST', headers: {'Content-Type': file.type || 'application/octet-stream'}, body: file});
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '辨識失敗');
    state.sheet = 0; state.sel = null; load(data); history.replaceState(null, '', '?run=' + encodeURIComponent(data.run.id)); refreshHistory();
  } catch (err) {
    showError(err.message); if (!D) $('#dropzone').hidden = false;
  } finally { clearInterval(tick); $('#busy').hidden = true; $('#file').value = ''; }
}
if (DEMO) {
  $('#title').textContent = '全員辨識・上傳模擬';
  document.title = '全員辨識上傳模擬';
  $('#uploadTools').hidden = false; $('#sheet').hidden = true;
  $('#file').onchange = ev => upload(ev.target.files[0]);
  $('#history').onchange = ev => ev.target.value && openRun(ev.target.value);
  const zone = $('#dropzone');
  document.addEventListener('dragover', ev => { ev.preventDefault(); zone.classList.add('over'); });
  document.addEventListener('dragleave', ev => { if (!ev.relatedTarget) zone.classList.remove('over'); });
  document.addEventListener('drop', ev => { ev.preventDefault(); zone.classList.remove('over'); upload(ev.dataTransfer.files[0]); });
  document.addEventListener('paste', ev => { const item = [...(ev.clipboardData?.items || [])].find(i => i.type.startsWith('image/')); if (item) upload(new File([item.getAsFile()], 'pasted.png', {type: item.type})); });
  refreshHistory();
  const run = new URLSearchParams(location.search).get('run');
  if (!D) document.body.classList.add('nodata');
  if (run) openRun(run); else { zone.hidden = false; $('#main').hidden = true; $('#stats').innerHTML = ''; }
} else {
  load(D);
}
})();
</script>
